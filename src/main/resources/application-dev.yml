# ============================================================
# 开发环境配置
# 使用 Testcontainers 提供 PostgreSQL 16 + pgvector，Flyway 开启
# 注：需要本地 Docker 运行中
# ============================================================
spring:
  # ---- Flyway 开启（pgvector 扩展 + 表 + 种子数据） ----
  flyway:
    enabled: true

  # ---- JPA ----
  jpa:
    hibernate:
      ddl-auto: validate   # 表由 Flyway 管理
    show-sql: true

  # ---- 排除 Redis 自动配置（本地无 Redis 时不影响启动） ----
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# ---- 日志 ----
logging:
  level:
    com.diagnostic: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE   # 绑定参数可见

# ---- Actuator：dev 暴露所有 ----
management:
  endpoints:
    web:
      exposure:
        include: "*"
