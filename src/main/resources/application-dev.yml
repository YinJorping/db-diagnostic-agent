# ============================================================
# 开发环境配置
# 连接 docker-compose PostgreSQL（docker-compose up -d 启动）
# Flyway 自动迁移 + pgvector + 诊断场景数据
# ============================================================
diagnostic:
  datasource:
    testcontainers: false  # 关闭 Testcontainers，使用 docker-compose PostgreSQL

spring:
  # ---- 数据源：连接 docker-compose PostgreSQL ----
  datasource:
    url: jdbc:postgresql://localhost:5432/dbdiagnostic
    username: diagnostic
    password: diagnostic
    driver-class-name: org.postgresql.Driver

  # ---- Flyway 开启（pgvector 扩展 + 表 + 种子数据） ----
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0        # V1-V7 全部应用

  # ---- JPA ----
  jpa:
    hibernate:
      ddl-auto: validate   # 表由 Flyway 管理
    show-sql: true

  # ---- 排除 Redis 自动配置（本地无 Redis 时不影响启动） ----
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# ---- 日志 ----
logging:
  level:
    com.diagnostic: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE   # 绑定参数可见

# ---- Actuator：dev 暴露所有 ----
management:
  endpoints:
    web:
      exposure:
        include: "*"
