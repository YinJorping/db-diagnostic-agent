# ============================================================
# 通用配置（所有 profile 共享）
# ============================================================
spring:
  application:
    name: db-diagnostic-agent
  profiles:
    active: dev

  # ---- Jackson ----
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  # ---- 通用 JPA ----
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 生产强制 validate，DDL 由 Flyway 管理
    properties:
      hibernate:
        format_sql: true

# ---- 服务端口 ----
server:
  port: 8080

# ---- Actuator（全局最小暴露，prod 再收紧） ----
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# ---- 应用信息（Actuator /actuator/info） ----
info:
  app:
    name: "@project.name@"
    version: "@project.version@"
    description: "@project.description@"
    java: "@java.version@"

# ---- 诊断平台配置 ----
diagnostic:
  llm:
    provider: mock           # mock | deepseek | openai | moonshot | ...
    timeout: 30s             # HTTP connect + request timeout
    temperature: 0.3         # 诊断场景需确定性输出
    max-tokens: 1024
    providers:
      deepseek:
        api-key: ${DEEPSEEK_API_KEY:}
        model: deepseek-chat
        base-url: https://api.deepseek.com/v1
      openai:
        api-key: ${OPENAI_API_KEY:}
        model: gpt-4o
        base-url: https://api.openai.com/v1
      # 新增 OpenAI 兼容 provider 只需加一段：
      # moonshot:
      #   api-key: ${MOONSHOT_API_KEY:}
      #   model: moonshot-v1-8k
      #   base-url: https://api.moonshot.cn/v1
  tool:
    timeout-seconds: 5       # Tool 执行超时
  memory:
    ttl-minutes: 30          # ChatMemory Redis TTL
    threshold-buffer-hit-high: 0.99
    threshold-buffer-hit-medium: 0.95
    threshold-temp-files-count: 100
    threshold-temp-bytes-bytes: 1073741824
    threshold-shared-buffers-mb: 256
    threshold-work-mem-mb: 256
  jvm:
    threshold-heap-high: 0.85
    threshold-heap-medium: 0.70
    threshold-non-heap-high: 0.90
    threshold-thread-count: 500
  disk:
    data-dir: /var/lib/postgresql/data
    threshold-usage-high: 0.85
    threshold-usage-medium: 0.70
    threshold-free-bytes-low: 10737418240
  executor:
    core-pool-size: 2        # Agent 并行线程池常驻线程
    max-pool-size: 4         # 峰值线程数
    queue-capacity: 100      # 有界队列容量
  cpu:
    threshold-system-high: 0.9
    threshold-system-medium: 0.7
    threshold-process-high: 0.8
    threshold-load-high-multiplier: 1.5
    threshold-load-medium-multiplier: 1.0
  workflow:
    max-steps: 10            # 单次诊断最大步骤数
