# ============================================================
# 生产环境配置
# 所有敏感信息通过环境变量注入，严禁硬编码
# ============================================================
spring:
  # ---- PostgreSQL + pgvector ----
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dbdiagnostic}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 1800000

  # ---- Flyway 开启 ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true          # 生产禁止 clean

  # ---- JPA ----
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ---- Redis ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 5s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

# ---- 日志（生产默认 WARN，减少 IO） ----
logging:
  level:
    com.diagnostic: INFO
    org.springframework: WARN
  file:
    path: /var/log/db-diagnostic-agent
    name: ${logging.file.path}/app.log

# ---- Actuator（生产最小暴露） ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# ---- LLM（生产走真实 API） ----
diagnostic:
  llm:
    provider: ${LLM_PROVIDER:deepseek}
    providers:
      deepseek:
        api-key: ${DEEPSEEK_API_KEY}
        model: ${LLM_MODEL:deepseek-chat}
        base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
